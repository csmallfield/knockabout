      <path id="collar" fill="#f4e9c8" d="M112 172 L130 174 L124 188 Z"/>
      <rect id="belt" fill="#5b3a26" x="78" y="240" width="68" height="12" rx="3"/>
      <rect id="buckle" class="flat" fill="#e8b84a" x="134" y="238" width="10" height="16" rx="3"/>
      <path id="scarf" fill="#d8433b" d="M88 176 C100 184 122 184 132 178 L134 190 C122 198 100 198 86 190 Z"/>
