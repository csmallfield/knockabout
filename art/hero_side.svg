    </g>
    <g id="leg_r_upper"><circle id="pivot-leg_r_upper" cx="112" cy="268" r="2" fill="none"/>
      <rect fill="#3a2f45" x="102" y="264" width="20" height="28" rx="7"/>
      <g id="leg_r_lower"><circle id="pivot-leg_r_lower" cx="112" cy="290" r="2" fill="none"/>
