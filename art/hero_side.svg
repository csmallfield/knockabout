    <g id="torso"><circle id="pivot-torso" cx="110" cy="262" r="2" fill="none"/>
      <g id="arm_l_upper"><circle id="pivot-arm_l_upper" cx="104" cy="204" r="2" fill="none"/>
        <rect fill="#367a4f" x="97" y="198" width="15" height="34" rx="7"/>
        <g id="arm_l_lower"><circle id="pivot-arm_l_lower" cx="104" cy="230" r="2" fill="none"/>
          <rect fill="#367a4f" x="98" y="226" width="13" height="24" rx="6"/>
          <g id="hand_l"><circle id="pivot-hand_l" cx="104" cy="252" r="2" fill="none"/>
            <circle fill="#e2ad85" cx="104" cy="256" r="8.5"/>
          </g>
        </g>
      </g>
    </g>
    <g id="leg_l_upper"><circle id="pivot-leg_l_upper" cx="102" cy="268" r="2" fill="none"/>
      <rect fill="#2e2538" x="92" y="264" width="20" height="28" rx="7"/>
