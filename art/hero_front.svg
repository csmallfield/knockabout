          <path id="tuft" fill="#a14b30" d="M96 38 C92 22 100 8 116 4 C108 14 110 24 116 34 C110 34 102 36 96 38 Z"/>
        </g>
      </g>
      <g id="arm_r_upper"><circle id="pivot-arm_r_upper" cx="156" cy="206" r="2" fill="none"/>
        <path fill="#3f8f5c" d="M162 198 C170 208 173 220 171 232 L157 234 C157 224 154 214 147 205 Z"/>
        <g id="arm_r_lower"><circle id="pivot-arm_r_lower" cx="164" cy="232" r="2" fill="none"/>
          <rect fill="#3f8f5c" x="157" y="228" width="14" height="24" rx="6"/>
          <g id="hand_r"><circle id="pivot-hand_r" cx="164" cy="254" r="2" fill="none"/>
            <circle fill="#f2bf96" cx="164" cy="257" r="9"/>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
