<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 330">
  <!-- Cutout Isle hero, front view, never mirrored in play: the sword arm (arm_r)
       is the hero's right, on screen left. The whole drawing is flipped by the
       transform on "hips" (drawn with the sword arm on the right, then turned
       round). Rig parts are groups with a pivot marker (id "pivot..."); document
       order is draw order; class "flat" = no outline. Feet rest at (110, 318). -->
  <g id="hips" transform="matrix(-1 0 0 1 220 0)"><circle id="pivot-hips" cx="110" cy="262" r="2" fill="none"/>
    <g id="leg_l_upper"><circle id="pivot-leg_l_upper" cx="94" cy="268" r="2" fill="none"/>
      <rect fill="#3a2f45" x="84" y="264" width="20" height="28" rx="7"/>
      <g id="leg_l_lower"><circle id="pivot-leg_l_lower" cx="94" cy="290" r="2" fill="none"/>
        <rect fill="#3a2f45" x="85" y="286" width="18" height="22" rx="6"/>
        <g id="foot_l"><circle id="pivot-foot_l" cx="94" cy="306" r="2" fill="none"/>
          <path fill="#5b3a26" d="M80 302 L106 302 L106 318 L76 318 C76 310 77 305 80 302 Z"/>
        </g>
      </g>
    </g>
    <g id="leg_r_upper"><circle id="pivot-leg_r_upper" cx="126" cy="268" r="2" fill="none"/>
      <rect fill="#3a2f45" x="116" y="264" width="20" height="28" rx="7"/>
      <g id="leg_r_lower"><circle id="pivot-leg_r_lower" cx="126" cy="290" r="2" fill="none"/>
        <rect fill="#3a2f45" x="117" y="286" width="18" height="22" rx="6"/>
        <g id="foot_r"><circle id="pivot-foot_r" cx="126" cy="306" r="2" fill="none"/>
          <path fill="#5b3a26" d="M114 302 L140 302 C143 305 144 310 144 318 L114 318 Z"/>
        </g>
      </g>
    </g>
    <g id="torso"><circle id="pivot-torso" cx="110" cy="262" r="2" fill="none"/>
      <g id="arm_l_upper"><circle id="pivot-arm_l_upper" cx="64" cy="206" r="2" fill="none"/>
        <path fill="#3f8f5c" d="M58 198 C50 208 47 220 49 232 L63 234 C63 224 66 214 73 205 Z"/>
        <g id="arm_l_lower"><circle id="pivot-arm_l_lower" cx="56" cy="232" r="2" fill="none"/>
          <rect fill="#3f8f5c" x="49" y="228" width="14" height="24" rx="6"/>
          <g id="hand_l"><circle id="pivot-hand_l" cx="56" cy="254" r="2" fill="none"/>
            <circle fill="#f2bf96" cx="56" cy="257" r="9"/>
          </g>
        </g>
      </g>
      <path id="tunic" fill="#4fa86c" d="M82 172 L138 172 C152 176 160 190 162 210 L170 280 C150 288 70 288 50 280 L58 210 C60 190 68 176 82 172 Z"/>
      <path id="collar" fill="#f4e9c8" d="M90 172 L130 172 L110 192 Z"/>
      <rect id="belt" fill="#5b3a26" x="57" y="240" width="106" height="12" rx="3"/>
      <rect id="buckle" class="flat" fill="#e8b84a" x="102" y="238" width="16" height="16" rx="3"/>
      <path id="scarf" fill="#d8433b" d="M78 178 C92 188 128 188 142 178 L144 190 C128 202 92 202 76 190 Z"/>
      <path id="scarf_knot" fill="#c23a33" d="M118 188 L132 186 L134 200 L120 202 Z"/>
      <g id="head"><circle id="pivot-head" cx="110" cy="182" r="2" fill="none"/>
        <g transform="translate(10, 4)">
          <path id="hair_back" fill="#8a3f2a" d="M100 18 C150 18 186 52 184 104 C183 136 170 160 150 170 L50 170 C30 160 17 136 16 104 C14 52 50 18 100 18 Z"/>
          <circle id="ear_l" fill="#f2bf96" cx="34" cy="118" r="14"/>
          <circle id="ear_r" fill="#f2bf96" cx="166" cy="118" r="14"/>
          <ellipse id="face" fill="#f7cfa6" cx="100" cy="120" rx="66" ry="60"/>
          <ellipse id="blush_l" class="flat" fill="#f3998a" cx="58" cy="140" rx="12" ry="7"/>
          <ellipse id="blush_r" class="flat" fill="#f3998a" cx="142" cy="140" rx="12" ry="7"/>
          <g id="eyes"><circle id="pivot-eyes" cx="100" cy="122" r="2" fill="none"/>
            <ellipse id="eye_l" class="flat" fill="#1f1a26" cx="74" cy="122" rx="9.5" ry="14"/>
            <ellipse id="eye_r" class="flat" fill="#1f1a26" cx="126" cy="122" rx="9.5" ry="14"/>
            <circle id="glint_l" class="flat" fill="#ffffff" cx="77" cy="116" r="3.6"/>
            <circle id="glint_r" class="flat" fill="#ffffff" cx="129" cy="116" r="3.6"/>
